<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>The Underworks — Chapter VI: The Last Shift</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #000;
        overflow: hidden;
      }
      #game-canvas {
        display: block;
        width: 100vw;
        height: 100vh;
        cursor: crosshair;
        outline: none;
      }
      #terminal-message {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        background: #000;
        color: #e9e1cf;
        font-family: 'Courier New', Courier, monospace;
        text-align: center;
        padding: 24px;
      }
      #terminal-message[hidden] {
        display: none;
      }
      #terminal-message [data-role='headline'] {
        color: #d2262f;
        font-size: 40px;
        font-weight: 700;
        letter-spacing: 0.08em;
      }
      #terminal-message [data-role='detail'] {
        max-width: 720px;
        font-size: 18px;
        opacity: 0.75;
      }
    </style>
  </head>
  <body>
    <canvas id="game-canvas" tabindex="0"></canvas>
    <div id="terminal-message" hidden>
      <div data-role="headline"></div>
      <div data-role="detail"></div>
    </div>
    <script type="module" src="./dist/main.js"></script>
  </body>
</html>
