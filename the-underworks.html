  return left[0] * right[0] + left[1] * right[1] + left[2] * right[2];
}
function vec3Cross(left, right) {

    left[1] * right[2] - left[2] * right[1],

var MeshBuilder = class {

function aabbFromCenter(center, halfExtents) {

}

    const originComponent = origin[axis];
    const directionComponent = direction[axis];
    const minimumComponent = box.minimum[axis];
    const maximumComponent = box.maximum[axis];
    if (Math.abs(directionComponent) < 1e-12) {
      if (originComponent < minimumComponent || originComponent > maximumComponent) {
        return null;
      }
      continue;
    }
    const inverseDirection = 1 / directionComponent;
    let nearDistance = (minimumComponent - originComponent) * inverseDirection;
    let farDistance = (maximumComponent - originComponent) * inverseDirection;
    let faceSign = -1;
    if (nearDistance > farDistance) {
      const swap = nearDistance;
      nearDistance = farDistance;
      farDistance = swap;
      faceSign = 1;
    }
    if (nearDistance > entryDistance) {
      entryDistance = nearDistance;
      entryAxis = axis;
      entrySign = faceSign;
    }
    if (farDistance < exitDistance) {
      exitDistance = farDistance;
    }
    if (entryDistance > exitDistance) {
      return null;
    }
  }

    return null;
  }

  if (distance > maximumDistance) {
    return null;
  }

  normal[entryAxis] = entrySign;

    distance,
    point: [origin[0] + direction[0] * distance, origin[1] + direction[1] * distance, origin[2] + direction[2] * distance],
    normal

}

  isCrouching = false;

    const halfWidth = this.tuning.halfWidth;
    for (const collider of this.scratchColliders) {
      const current = this.boundsAt(this.position);
      if (!aabbOverlaps(current, collider)) {
        continue;
      }
      if (displacement > 0) {
        const extent = axis === 1 ? this.currentHeight : halfWidth;
        this.position[axis] = collider.minimum[axis] - extent - skin;
        hitNormal = [0, 0, 0];
        hitNormal[axis] = -1;
      } else {
        const extent = axis === 1 ? 0 : halfWidth;
        this.position[axis] = collider.maximum[axis] + extent + skin;
        hitNormal = [0, 0, 0];
        hitNormal[axis] = 1;
      }
    }
    return hitNormal;
  }
  /**
   * Collision response:
   *   1. clip:   v ← v − n·(v·n)·overbounce          (removes the into-surface component)
   *   2. curve:  tangential retention r = lerp(r_min, 1, (1 − |v̂·n|)^k)
   *      Grazing contacts (|v̂·n| → 0) keep full speed; head-on impacts keep r_min of the slide speed.
   */
  applyCollisionResponse(normal, preImpactVelocity) {
    const speedBefore = Math.hypot(preImpactVelocity[0], preImpactVelocity[1], preImpactVelocity[2]);
    const into = this.velocity[0] * normal[0] + this.velocity[1] * normal[1] + this.velocity[2] * normal[2];
    if (into < 0) {
      this.velocity[0] -= normal[0] * into * this.tuning.overbounce;
      this.velocity[1] -= normal[1] * into * this.tuning.overbounce;
      this.velocity[2] -= normal[2] * into * this.tuning.overbounce;
    }
    if (normal[1] !== 0 || speedBefore < 1e-4) {
      return;
    }
    const impactCosine = Math.abs(
      (preImpactVelocity[0] * normal[0] + preImpactVelocity[1] * normal[1] + preImpactVelocity[2] * normal[2]) / speedBefore
    );
    const retention = lerp(this.tuning.wallMinimumTangentRetention, 1, Math.pow(1 - impactCosine, this.tuning.wallResponseExponent));
    this.velocity[0] *= retention;
    this.velocity[2] *= retention;
  }
  /** Attempts a horizontal move with automatic step-up over obstacles shorter than `stepHeight`. */
  moveHorizontal(axis, displacement, world) {
    if (displacement === 0) {
      return;
    }
    const before = [this.position[0], this.position[1], this.position[2]];
    const preImpactVelocity = [this.velocity[0], this.velocity[1], this.velocity[2]];
    const hit = this.moveAxis(axis, displacement, world);
    if (hit === null) {
      return;
    }
    if (this.isGrounded) {
      const lifted = [before[0], before[1] + this.tuning.stepHeight, before[2]];
      if (!this.overlapsWorld(this.boundsAt(lifted), world)) {
        const steppedTarget = [lifted[0], lifted[1], lifted[2]];
        steppedTarget[axis] = steppedTarget[axis] + displacement;
        if (!this.overlapsWorld(this.boundsAt(steppedTarget), world)) {
          this.position = steppedTarget;
          this.moveAxis(1, -this.tuning.stepHeight - 0.01, world);
          return;
        }
      }
    }
    this.applyCollisionResponse(hit, preImpactVelocity);
  }
  /** Translates the character by `delta` with full collision (used by tether constraint projection). */
  translateWithCollision(delta, world) {
    this.moveAxis(1, delta[1], world);
    this.moveHorizontal(0, delta[0], world);
    this.moveHorizontal(2, delta[2], world);
  }
  // ---- Step --------------------------------------------------------------------------------------------------------
  step(deltaSeconds, intent, world, externalAcceleration) {
    const tuning = this.tuning;
    const blockedByCeilingOnStand = this.resolveStance(intent, world);
    const coefficients = tuning.stances[this.stance];
    this.jumpBufferRemaining = intent.jumpPressed ? tuning.jumpBufferSeconds : Math.max(0, this.jumpBufferRemaining - deltaSeconds);
    this.secondsSinceGrounded = this.isGrounded ? 0 : this.secondsSinceGrounded + deltaSeconds;
    let jumpedThisStep = false;
    if (this.jumpBufferRemaining > 0 && this.secondsSinceGrounded <= tuning.coyoteSeconds && !this.isCrouching) {
      this.velocity[1] = tuning.jumpVelocity;
      this.isGrounded = false;
      this.secondsSinceGrounded = tuning.coyoteSeconds + 1;
      this.jumpBufferRemaining = 0;
      jumpedThisStep = true;
    }
    let forwardInput = clamp(intent.moveForward, -1, 1);
    let rightInput = clamp(intent.moveRight, -1, 1);
    const inputMagnitude = Math.hypot(forwardInput, rightInput);
    if (inputMagnitude > 1) {
      forwardInput /= inputMagnitude;
      rightInput /= inputMagnitude;
    }
    const sinYaw = Math.sin(intent.yawRadians);
    const cosYaw = Math.cos(intent.yawRadians);
    const wishX = -sinYaw * forwardInput + cosYaw * rightInput;
    const wishZ = -cosYaw * forwardInput - sinYaw * rightInput;
    const wishLength = Math.hypot(wishX, wishZ);
    const wishDirectionX = wishLength > 1e-5 ? wishX / wishLength : 0;
    const wishDirectionZ = wishLength > 1e-5 ? wishZ / wishLength : 0;
    const wishSpeed = coefficients.maximumSpeed * this.speedMultiplier * Math.min(1, wishLength);
    if (this.isGrounded && !jumpedThisStep) {
      this.applyFriction(coefficients, deltaSeconds);
      this.accelerate(wishDirectionX, wishDirectionZ, wishSpeed, coefficients.acceleration, wishSpeed, deltaSeconds);
    } else {
      this.accelerate(wishDirectionX, wishDirectionZ, wishSpeed, tuning.airAcceleration, tuning.airWishSpeedCap, deltaSeconds);
    }
    this.velocity[0] += externalAcceleration[0] * deltaSeconds;
    this.velocity[1] += (externalAcceleration[1] - tuning.gravity) * deltaSeconds;
    this.velocity[2] += externalAcceleration[2] * deltaSeconds;
    this.velocity[1] = Math.max(this.velocity[1], -tuning.terminalVelocity);
    const isRunning = this.stance === "run" && this.horizontalSpeed > coefficients.maximumSpeed * 0.5;
    this.stamina = clamp(this.stamina + (isRunning ? -tuning.staminaDrainPerSecond : tuning.staminaRegenPerSecond) * deltaSeconds, 0, 1);
    const wasGrounded = this.isGrounded;
    const fallSpeedBeforeMove = -this.velocity[1];
    const travel = Math.hypot(this.velocity[0], this.velocity[1], this.velocity[2]) * deltaSeconds;
    const substeps = Math.max(1, Math.ceil(travel / tuning.maximumSubstepDistance));
    const substepSeconds = deltaSeconds / substeps;
    this.isGrounded = false;
    for (let substep = 0; substep < substeps; substep += 1) {
      const verticalVelocity = this.velocity[1];
      const verticalHit = this.moveAxis(1, verticalVelocity * substepSeconds, world);
      if (verticalHit !== null) {
        if (verticalHit[1] > 0) {
          this.isGrounded = true;
        }
        this.velocity[1] = 0;
      }
      this.moveHorizontal(0, this.velocity[0] * substepSeconds, world);
      this.moveHorizontal(2, this.velocity[2] * substepSeconds, world);
    }
    if (!this.isGrounded && this.velocity[1] <= 0) {
      const probe = this.boundsAt([this.position[0], this.position[1] - 0.04, this.position[2]]);
      if (this.overlapsWorld(probe, world)) {
        this.isGrounded = true;
      }
    }
    const targetEyeHeight = this.isCrouching ? tuning.crouchingEyeHeight : tuning.standingEyeHeight;
    this.smoothedEyeHeight = damp(this.smoothedEyeHeight, targetEyeHeight, tuning.crouchTransitionSharpness, deltaSeconds);
    const landedThisStep = !wasGrounded && this.isGrounded;
    return {
      landedThisStep,
      landingImpactSpeed: landedThisStep ? Math.max(0, fallSpeedBeforeMove) : 0,
      jumpedThisStep,
      blockedByCeilingOnStand
    };
  }
};

// src/gameplay/GasMaskSystem.ts
var DEFAULT_GAS_MASK_TUNING = {
  equipSeconds: 0.7,
  unequipSeconds: 0.5,
  filterCapacitySeconds: 40,
  filterRegenerationPerSecond: 0.025,
  exposureGainPerSecond: 0.12,
  exposureRecoveryPerSecond: 0.07,
  exertionExposureMultiplier: 0.6,
  breathableThreshold: 0.02,
  tickIntervalCalmSeconds: 1.1,
  tickIntervalCriticalSeconds: 0.12,
  baseBreathsPerSecond: 0.24
};
var GasMaskSystem = class {
  constructor(tuning = DEFAULT_GAS_MASK_TUNING) {
    this.tuning = tuning;
    this.breathsPerSecond = tuning.baseBreathsPerSecond;
  }
  tuning;
  phase = "unavailable";
  coverage = 0;
  filterRemaining = 1;
  exposure = 0;
  concentration = 0;
  effectiveConcentration = 0;
  areaStatus = "clean";
  breathsPerSecond;
  /** 0..1 position inside the current breath; < 0.42 inhale, otherwise exhale. */
  breathPhase = 0;
  exposureRising = false;
  tickAccumulator = 0;
  get isAvailable() {
    return this.phase !== "unavailable";
  }
  get isWorn() {
    return this.phase === "worn";
  }
  /** Exhale condensation on the lenses, 0..1, peaking early in the exhale. */
  get lensFog() {
    if (this.breathPhase < 0.42) {
      return Math.max(0, 1 - this.breathPhase / 0.42) * 0.35;
    }
    const exhaleProgress = (this.breathPhase - 0.42) / 0.58;
    return Math.sin(Math.min(1, exhaleProgress * 1.6) * Math.PI * 0.5) * (1 - exhaleProgress * 0.4);
  }
  grant() {
    if (this.phase === "unavailable") {
      this.phase = "stowed";
      this.coverage = 0;
      this.filterRemaining = 1;
    }
  }
  restore(hasMask) {
    this.phase = hasMask ? "stowed" : "unavailable";
    this.coverage = 0;
    this.filterRemaining = 1;
    this.exposure = 0;
    this.tickAccumulator = 0;
  }
  update(deltaSeconds, input) {
    const tuning = this.tuning;
    let toggledTo = null;
    if (input.toggleRequested && this.phase !== "unavailable") {
      if (this.phase === "stowed" || this.phase === "unequipping") {
        this.phase = "equipping";
        toggledTo = "equipping";
      } else {
        this.phase = "unequipping";
        toggledTo = "unequipping";
      }
    }
    if (this.phase === "equipping") {
      this.coverage = Math.min(1, this.coverage + deltaSeconds / tuning.equipSeconds);
      if (this.coverage >= 1) {
        this.phase = "worn";
      }
    } else if (this.phase === "unequipping") {
      this.coverage = Math.max(0, this.coverage - deltaSeconds / tuning.unequipSeconds);
      if (this.coverage <= 0) {
        this.phase = "stowed";
      }
    }
    this.concentration = clamp(input.concentration, 0, 1);
    const sealed = this.filterRemaining > 0;
    const protection = sealed ? this.coverage : 0;
    this.effectiveConcentration = this.concentration * (1 - protection);
    const exertion = clamp(input.exertion, 0, 1);
    const previousExposure = this.exposure;
    if (this.effectiveConcentration > tuning.breathableThreshold) {
      this.exposure += tuning.exposureGainPerSecond * this.effectiveConcentration * (1 + tuning.exertionExposureMultiplier * exertion) * deltaSeconds;
      this.areaStatus = "contaminated";
    } else if (this.concentration <= tuning.breathableThreshold) {
      this.exposure -= tuning.exposureRecoveryPerSecond * deltaSeconds;
      this.areaStatus = "clean";
    } else {
      this.areaStatus = "filtered";
    }
    this.exposure = clamp(this.exposure, 0, 1);
    this.exposureRising = this.exposure > previousExposure;
    if (this.coverage > 0.5 && this.concentration > tuning.breathableThreshold) {
      this.filterRemaining = Math.max(0, this.filterRemaining - this.concentration * deltaSeconds / tuning.filterCapacitySeconds);
    } else if (this.concentration <= tuning.breathableThreshold) {
      this.filterRemaining = Math.min(1, this.filterRemaining + tuning.filterRegenerationPerSecond * deltaSeconds);
    }
    let meterTicked = false;
    if (this.exposureRising) {
      const interval = lerp(tuning.tickIntervalCalmSeconds, tuning.tickIntervalCriticalSeconds, this.exposure);
      this.tickAccumulator += deltaSeconds;
      if (this.tickAccumulator >= interval) {
        this.tickAccumulator -= interval;
        meterTicked = true;
      }
    } else {
      this.tickAccumulator = 0;
    }
    const filterStrain = this.coverage > 0.5 ? 1 - this.filterRemaining : 0;
    this.breathsPerSecond = tuning.baseBreathsPerSecond * (1 + exertion * 1.1 + this.exposure * 1.6 + filterStrain * 0.5);
    const previousPhase = this.breathPhase;
    this.breathPhase = (this.breathPhase + this.breathsPerSecond * deltaSeconds) % 1;
    const breathCycleStarted = this.breathPhase < previousPhase;
    return { toggledTo, meterTicked, lethal: this.exposure >= 1, breathCycleStarted };
  }
};

// src/gameplay/RelayPlateNetwork.ts
var RelayPlateNetwork = class {
  constructor(events, streamer, rig) {
    this.events = events;
    this.streamer = streamer;
    this.rig = rig;
    this.unsubscribers.push(
      events.on("clawLatched", (payload) => this.handleLatch(payload.side, payload.polarity, payload.target))
    );
  }
  events;
  streamer;
  rig;
  unsubscribers = [];
  contactLog = [];
  clockSeconds = 0;
  get recentContacts() {
    return this.contactLog;
  }
  tick(deltaSeconds) {
    this.clockSeconds += deltaSeconds;
  }
  record(entry) {
    this.contactLog.push(entry);
    if (this.contactLog.length > 16) {
      this.contactLog.shift();
    }
  }
  handleLatch(side, clawPolarity, target) {
    if (target.kind !== "relayPlate" || target.polarity === null) {
      return;
    }
    const platePolarity = target.polarity;

  log(line) {
    this.logLines.push(line);
    if (this.logLines.length > 14) {
      this.logLines.shift();
    }
  }
  enter(_payload) {
    this.phase = "loadingMaterials";
    this.progress = 0;
    this.displayedProgress = 0;
    this.elapsedInState = 0;
    this.logLines.length = 0;
    const gl = this.services.gl;
    this.log(`${GAME_IDENTITY.companyName.toUpperCase()} // MAINTENANCE TERMINAL`);
    this.log(`RENDERER: ${String(gl.getParameter(gl.VERSION))}`);
    this.log(`SHADER PROGRAMS: scene / volumetric-fog / crt-vhs-composite .... OK`);
    void this.runLoadSequence();
  }
  async runLoadSequence() {
    const materialWeight = MaterialRegistry.totalCount;
    const meshWeight = MeshLibrary.totalCount;
    const totalWeight = materialWeight + meshWeight;
    try {
      let lastMaterial = "";
      await this.services.materials.loadAll((progress) => {
        this.progress = progress.loadedCount / totalWeight;
        if (progress.currentMaterialName !== "complete" && progress.currentMaterialName !== lastMaterial) {
          lastMaterial = progress.currentMaterialName;
          this.log(`BAKE MATERIAL  ${progress.currentMaterialName}`);
        }
      });
      this.log(`MATERIAL REGISTRY: ${materialWeight} profiles resident .... OK`);
      this.phase = "loadingMeshes";
      await this.services.meshes.loadAll((loadedCount, _totalCount, currentName) => {
        this.progress = (materialWeight + loadedCount) / totalWeight;
        if (currentName !== "complete") {
          this.log(`IMPORT MESH    ${currentName}`);
        }
      });
      this.log(`MESH LIBRARY: ${meshWeight} imported assets resident .... OK`);
      this.log("ALL SYSTEMS NOMINAL. THE NIGHT SHIFT IS WAITING.");
      this.progress = 1;
      this.phase = "awaitingGesture";
    } catch (error) {
      this.phase = "failed";
      this.failureMessage = error instanceof Error ? error.message : String(error);
      this.log("FATAL: asset bootstrap failed. See console.");

    }
  }
  exit() {
    this.logLines.length = 0;
  }
  update(frame) {
    this.elapsedInState += frame.deltaSeconds;
    this.displayedProgress = clamp(this.displayedProgress + (this.progress - this.displayedProgress) * Math.min(1, frame.deltaSeconds * 8), 0, 1);
    if (this.phase === "awaitingGesture" && frame.inputEnabled && this.services.input.anyGestureThisFrame) {
      this.services.audio.unlock();

    context.font = UI_FONTS.bootloader;
    context.fillStyle = "rgba(233, 225, 207, 0.75)";
    this.logLines.forEach((line, index) => {
      context.fillText(line, 120, 140 + index * 44);
    });
    const barWidth = 1100;
    const barX = centerX - barWidth / 2;
    const barY = 860;

    context.lineWidth = 3;
    context.strokeRect(barX, barY, barWidth, 34);

    context.textAlign = "center";
    if (this.phase === "awaitingGesture") {
      const blink = 0.45 + 0.55 * Math.abs(Math.sin(frame.elapsedSeconds * 2.4));
      context.globalAlpha = blink;
      context.font = UI_FONTS.chapter;
      context.fillStyle = UI_COLORS.textPrimary;
      context.fillText("PRESS ANY KEY OR CLICK TO CLOCK IN", centerX, 980);

      context.fillText(this.failureMessage.slice(0, 140), centerX, 980);
    } else {
      context.font = UI_FONTS.small;
      context.fillStyle = UI_COLORS.textDim;
      const dots = ".".repeat(1 + Math.floor(this.elapsedInState * 3) % 3);
      context.fillText(`${this.phase === "loadingMaterials" ? "BAKING MATERIALS" : "IMPORTING MESHES"}${dots}`, centerX, 980);
    }

  }
